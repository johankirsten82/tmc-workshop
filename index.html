<!-- =====================================================================
  TMC BASE APP — CONFIG. Change ONLY this block for a new app, then run:
      python3 tools/apply_config.py
  (it writes manifest.json, sw.js cache/version, icons and the QR code).
  APP_ID: short, lowercase, unique per app (e.g. "purshes", "grv", "food").
          Every storage key, cache, manifest id and SW is namespaced by it,
          so apps on the same site / same phone never share data.
  CACHE_PREFIX (optional): cache name start, lowercase letters/digits and
          single hyphens (e.g. "tmc-fuel" gives caches "tmc-fuel-v1").
          Defaults to APP_ID. Storage keys always use APP_ID (no hyphens).
  SYNC_URL: this app's own Google Apps Script /exec link. Put it HERE so a
          fresh install is connected at once (the link is public, that's fine).
  SYNC_CODE: leave EMPTY (VER 4+). Phones then sign in with name + PIN and
          get a session token from the script. A code is only for old apps;
          it can also arrive by a join link  .../#k=CODE  (saved, then wiped
          from the address bar). Never put a real code in a public repo.
  ADMIN_ALIASES: name keys (lowercase, no spaces/dots) that mean the Admin.
====================================================================== -->

 "BASE_VERSION": "1.0.0",

  "PERMS": [
    {"id":"view","icon":"👁️","en":"View","fr":"Voir","ar":"عرض","af":"Kyk"},

/* VER 4 token flow: ask the script who this name is (works on a fresh phone with no code) */
async function startName(raw){
  const name=clean(raw);if(!name)return err(t("needName"));
  L.set("lastName",name);
  if(tokMode())return srvLookup(name,true);
  // fresh phone / reinstall: pull everything from the Sheet BEFORE matching the name
  if(syncOn()&&!(+(L.get("since")||0)>0)){flow={s:"loading",name:name};render();await syncNow();
    if(!(+(L.get("since")||0)>0)&&!users().length){flow={s:"net",name:name};render();return}}
  lookup(name);
}
async function srvLookup(name,reg){
  flow={s:"loading",name:name};render();
  let j;try{j=await api({action:"status",name:name});if(j&&j.ok&&j.state==="none"&&reg)j=await api({action:"register",name:name})}catch(e){j=null}
  if(!j||!j.ok){if(users().length)return lookup(name,true);flow={s:"net",name:name};return render()}
  const st=j.state;
  if(st==="active"){const u=users().find(x=>x.id===j.id)||{id:j.id,name:j.name};flow={s:j.hasPin?"pin":"set",u:Object.assign({},u,{name:j.name,salt:j.salt||u.salt}),name:name,srv:1};return render()}
  if(st==="setup"){flow={s:"set",setup:true,u:{id:"",name:C.ADMIN_NAME},name:name,srv:1};return render()}
  if(st==="blocked"){flow={s:"blk",name:name};return render()}
  if(st==="rejected"){flow={s:"rej",name:name};return render()}
  if(st==="dup"||(st==="pending"&&j.other)){flow={s:"dup",name:name,srv:1};return render()}  // ONE request per name per app
  if(st==="none"&&!reg){flow={s:"gone",name:name};return render()}  // VER 7: the Admin discarded this request
  flow={s:"wait",name:name,srv:1};render();
}
async function gotToken(j,u){
  L.set("tok",j.token);L.del("since");await syncNow();
  const me_=users().find(x=>x.id===j.id);
  if(!me_){flow={s:"net",name:flow&&flow.name};return render()}
  if(!me_.pinH&&u&&u.pinH){me_.pinH=u.pinH;me_.salt=u.salt;saveR()}
  L.set("uid",me_.id);L.set("uok",me_.id+":"+me_.pinH);tab="home";flow=null;render();
}
function lookup(name,localOnly){
  if(tokMode()&&!localOnly)return srvLookup(name,true);
  const K=NK(name),all_=users().filter(u=>NK(u.name)===K),ok=all_.filter(approved);
  if(ok.length===1){if(!ok[0].pinH&&ok[0].hasPin&&!tokMode()&&navigator.onLine&&!localOnly)return srvLookup(name,true);if((tokMode()||ok[0].hasPin)&&!ok[0].pinH){flow={s:"net",name:name};return render()}  // token phones only hold their own PIN hash
    flow={s:ok[0].pinH?"pin":"set",u:ok[0],name:name};return render()}
  if(ok.length===0){
    if(all_.some(u=>u.status==="blocked")){flow={s:"blk",name:name};return render()}
    if(all_.some(u=>u.status==="rejected")){flow={s:"rej",name:name};return render()}
    if(!hasAdmin()&&K===ADMIN_KEY){flow={s:"set",setup:true,u:{id:"u"+Date.now(),name:C.ADMIN_NAME,status:"active",admin:1,dev:dev,at:new Date().toISOString()},name:name};return render()}
  }
  // no single approved match (none, or 2+ sharing the key): a normal approval request
  if(tokMode()){flow={s:"net",name:name};return render()}  // token phones register on the server only
  const own=users().find(u=>u.status==="pending"&&NK(u.name)===K&&(ok.length<2||(u.dev===dev&&clean(u.name).toLowerCase()===name.toLowerCase())));
  if(!own&&ok.length<2&&users().some(u=>NK(u.name)===K&&(u.status==="pending"||u.status==="active"))){flow={s:"dup",name:name};return render()}  // ONE request per name per app
  if(!own){const r={id:"r"+Date.now(),name:name,status:"pending",dev:dev,at:new Date().toISOString()};put("u",r.id,r)}
  flow={s:"wait",name:name};render();
}
async function checkPin(){
  const u=flow.u,k=NK(u.name),v=$("fPin").value;
  let F=fails_(k);
  if(F.length>=5){$("fPin").value="";return err(t("pinLock").replace("%m",Math.max(1,Math.ceil((F[0]+36e5-Date.now())/6e4))))}
  if(flow.srv&&navigator.onLine){let j=null;try{j=await api({action:"login",id:u.id,pinH:await H(v,u.salt)})}catch(e){}
    if(j&&j.ok){clearFail(k);return gotToken(j,Object.assign({},u,{pinH:await H(v,u.salt)}))}
    if(j){addFail(k);$("fPin").value="";return err(j.error==="locked"?t("pinLock").replace("%m",Math.max(1,Math.ceil(((j.until||Date.now()+36e5)-Date.now())/6e4))):t("pinWrong"))}}
  if(u.pinH&&await H(v,u.salt)===u.pinH){clearFail(k);L.set("uid",u.id);L.set("uok",u.id+":"+u.pinH);tab="home";flow=null;render();return}
  addFail(k);F=fails_(k);$("fPin").value="";
  err(F.length>=5?t("pinLock").replace("%m",60):t("pinWrong"));
}
async function setPin(){
  const a=$("fPin").value,b=$("fPin2").value;
  if(!/^[0-9]{4,6}$/.test(a))return err(t("pinBad"));if(a!==b)return err(t("pinDiff"));
  const u=Object.assign({},flow.u),salt=Math.random().toString(36).slice(2,12);u.salt=salt;u.pinH=await H(a,salt);
  if(flow.srv){let j=null;try{j=await api({action:"setpin",id:u.id,setup:flow.setup?1:0,name:flow.name,salt:salt,pinH:u.pinH})}catch(e){}
    if(j&&j.ok)return gotToken(j,u);return err(j?j.error:t("ncT"))}
  put("u",u.id,u);L.set("uid",u.id);L.set("uok",u.id+":"+u.pinH);tab="home";flow=null;render();
}

/* ---- VER 9 PHOTOS TO DRIVE (Johan 1 Nov 2026) ----
   Photo is made small on the phone (max 800px, JPEG ~0.5, aim 50-100 KB, digits still readable), kept in THIS app's own
   on-phone queue (IndexedDB "<APP_ID>_photos") until the upload worked, then sent to the app's own Drive folder (made by its
   own Code.gs). The server adds a "pl" record (link only) that syncs to every phone; the Sheet shows the Drive link.
   Offline = it waits and retries. Old photos: TMC.phBackfill([{id,d,at,ref}]) sends them in small batches (2 at a time),
   skipping any older than 2 months. Admin: TMC.phBtn(id) = big "View photo" button. Server deletes photos older than 2 months daily.
   TMC.phKeep(dataUrl,ref[,id[,at]]) -> photo id (put that id in your record). TMC.phState(id) -> drive|removed|phone|none. */
Object.assign(T.en,{phView:"🖼️ View photo",phGone:"Photo removed (older than 2 months)",phWait:"Photo not sent yet (still on the phone)",phClose:"✖ Close",phLoad:"Loading photo…",phNo:"Photo not found."});
Object.assign(T.fr,{phView:"🖼️ Voir la photo",phGone:"Photo supprimée (plus de 2 mois)",phWait:"Photo pas encore envoyée (encore sur le téléphone)",phClose:"✖ Fermer",phLoad:"Chargement de la photo…",phNo:"Photo introuvable."});
Object.assign(T.af,{phView:"🖼️ Kyk foto",phGone:"Foto verwyder (ouer as 2 maande)",phWait:"Foto nog nie gestuur nie (nog op die foon)",phClose:"✖ Maak toe",phLoad:"Foto laai…",phNo:"Foto nie gevind nie."});
Object.assign(T.ar,{phView:"🖼️ عرض الصورة",phGone:"تم حذف الصورة (أقدم من شهرين)",phWait:"الصورة لم تُرسل بعد (ما زالت على الهاتف)",phClose:"✖ إغلاق",phLoad:"جاري تحميل الصورة…",phNo:"الصورة غير موجودة."});
const PH_DAYS=60,PH_MAX=800,PH_Q=0.5,PH_AIM=136000;   // 136000 base64 chars ≈ 100 KB
let phDbP=null;
function phDb(){return phDbP||(phDbP=new Promise((ok,no)=>{try{const r=indexedDB.open(P+"photos",1);r.onupgradeneeded=()=>r.result.createObjectStore("q",{keyPath:"id"});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}catch(e){no(e)}}))}
function phTx(mode,f){return phDb().then(db=>new Promise((ok,no)=>{const tx=db.transaction("q",mode),s=tx.objectStore("q");let out;const r=f(s);if(r)r.onsuccess=()=>{out=r.result};tx.oncomplete=()=>ok(out);tx.onerror=()=>no(tx.error)}))}
const phQ={all:()=>phTx("readonly",s=>s.getAll()).then(a=>a||[]),get:id=>phTx("readonly",s=>s.get(id)),put:o=>phTx("readwrite",s=>s.put(o)),del:id=>phTx("readwrite",s=>s.delete(id))};
const phOld=at=>Date.now()-(Date.parse(at)||Date.now())>PH_DAYS*864e5;
const phRec=id=>{const r=R["pl:"+id];return r&&!r.del?r.data:null};
function phState(id){const d=phRec(id);return d?(d.removed?"removed":"drive"):(phLocal[id]?"phone":"none")}
const phLocal={};   // ids waiting in this phone's queue (filled from IndexedDB at start)
function phSmall(file){return shrinkPhoto(file,PH_MAX,PH_Q).then(d=>d.length<=PH_AIM?d:shrinkPhoto(file,PH_MAX,0.4)).then(d=>d.length<=PH_AIM?d:shrinkPhoto(file,PH_MAX,0.3))}
function phKeep(d,ref,id,at){id=String(id||("ph"+Date.now()+Math.random().toString(36).slice(2,6)));phLocal[id]=1;
  phQ.put({id:id,d:String(d),at:at||new Date().toISOString(),ref:String(ref||"").slice(0,80)}).then(()=>phSoon(300)).catch(e=>console.warn(e));return id}
function phBackfill(list){return phQ.all().then(q=>{const have={};q.forEach(o=>have[o.id]=1);let n=0;
  (list||[]).forEach(o=>{if(!o||!o.id||!o.d||have[o.id]||phRec(o.id)||phOld(o.at))return;phKeep(o.d,o.ref,o.id,o.at);n++});return n}).catch(()=>0)}
let phBusy=false,phTmr=null,phFails=0;
function phSoon(ms){clearTimeout(phTmr);phTmr=setTimeout(phPump,ms==null?2000:ms)}
function phPump(){if(phBusy||!syncOn()||!navigator.onLine)return Promise.resolve(0);if(tokMode()&&!sTok())return Promise.resolve(0);phBusy=true;let sent=0;
  return phQ.all().then(q=>{q.sort((a,b)=>String(a.at).localeCompare(String(b.at)));

function wNum(s){const t=String(s==null?"":s).trim().replace(/\s/g,"").replace(",",".");if(!t)return null;if(!/^\d+(\.\d+)?$/.test(t))return NaN;return +t}
function wFmt(n){if(n==null||!isFinite(+n))return "";const r=Math.round(+n*1000)/1000;const s=String(r);return (lang==="fr"||lang==="af")?s.replace(".",","):s}

function wWhen(at){const d=new Date(at);if(!at||isNaN(d.getTime()))return "";const day=d.toDateString()===new Date().toDateString()?"":d.toLocaleDateString(dLoc(),{day:"numeric",month:"short"})+" ";return day+hm(d)}

function wLenTxt(rows){const g={};rows.forEach(r=>{const n=+r.len||0;if(!n)return;const u=r.unit||"m";g[u]=(g[u]||0)+n});const ks=Object.keys(g);return ks.length?ks.map(u=>wFmt(g[u])+" "+u).join(" · "):""}
function wPcsTxt(rows){const n=rows.reduce((s,r)=>s+(+r.qty||0),0);return n?wFmt(n)+" "+t("wjPcsU"):""}
function wLine(rows){const a=wPcsTxt(rows),b=wLenTxt(rows);return [a,b].filter(Boolean).join(" · ")||"—"}
function foldName(s){return String(s||"").trim().normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\s+/g," ")}
function wApplied(ref){if(!ref)return true;const h=all("hj").find(x=>x.id===ref);return !!(h&&h.status==="applied")}
function wThou(k,q){const f=q?"qThou":"lThou";if(k[f]!=null&&isFinite(+k[f]))return +k[f];return Math.round(((q?+k.qty:+k.len)||0)*1000)}
function wClass(u){u=String(u||"").toLowerCase();if(u==="m"||u==="cm"||u==="mm")return "len";if(u==="piece"||u==="pieces"||u==="pc"||u==="pcs")return "piece";return "other"}
function wMoves(desc){const want=foldName(desc);return all("k").filter(k=>foldName(k.desc)===want&&(k.dir!=="in"||wApplied(k.ref))).sort((a,b)=>String(a.at||"").localeCompare(String(b.at||""))||String(a.id||"").localeCompare(String(b.id||"")))}

function wOn(mat,desc){let q=0,l=0;wMoves(desc).forEach(k=>{const piece=wClass(k.unit)==="piece",len=wClass(k.unit)==="len";if(k.dir==="set"){if(mat==="rope"||len)l=wAddThou(k,true);if(mat!=="rope"&&!len)q=wAddThou(k,false);return}if(mat==="rope"){if(k.dir==="out"){l-=wThou(k,0);return}if(len)l+=wAddThou(k,true);return}if(mat==="steel"){if(k.dir==="out"){q-=wThou(k,1);l-=wThou(k,0);return}if(piece)q+=wAddThou(k,false);else if(len)l+=wAddThou(k,true);return}if(k.dir==="out")q-=wThou(k,1);else q+=wAddThou(k,false)});return {qty:q/1000,len:l/1000}}
function wItemMat(desc){let steel=0,rope=0;wMoves(desc).forEach(k=>{if(k.mat==="steel"||wClass(k.unit)==="piece")steel=1;else if(k.mat==="rope"||wClass(k.unit)==="len")rope=1});return steel?"steel":rope?"rope":"other"}
function wStockItems(){const seen={},rows=[];all("k").forEach(k=>{if(k.dir==="in"&&!wApplied(k.ref))return;const key=foldName(k.desc);if(!k.desc||seen[key])return;seen[key]=1;const mat=wItemMat(k.desc);rows.push({mat:mat,desc:k.desc,bal:wOn(mat,k.desc)})});rows.sort((a,b)=>foldName(a.desc).localeCompare(foldName(b.desc)));return rows}
function wItemFlags(desc,mat){mat=mat||wItemMat(desc);let hasP=false,hasL=false;wMoves(desc).forEach(k=>{if(wClass(k.unit)==="len"||+k.len)hasL=true;if(wClass(k.unit)==="piece"||(+k.qty&&wClass(k.unit)!=="len")||(k.dir==="set"&&wClass(k.unit)!=="len"))hasP=true});if(mat==="rope"){hasL=true;hasP=false}return {mat:mat,hasP:hasP,hasL:hasL,len:!!(hasL||!hasP)}}

function wBalTxt(mat,desc,b){b=b||wOn(mat,desc);let hasP=false,hasL=false;wMoves(desc).forEach(k=>{if(wClass(k.unit)==="len"||+k.len)hasL=true;if(wClass(k.unit)==="piece"||+k.qty||(k.dir==="set"&&wClass(k.unit)!=="len"))hasP=true});if(mat==="rope"){hasL=true;hasP=false}if(!hasP&&!hasL)hasP=true;const bits=[];if(hasP)bits.push(wFmt(b.qty)+" "+t("wjPcsU"));if(hasL)bits.push(wFmt(b.len)+" m");return bits.join(" · ")}

function wSaveMat(u){
  const rows=(WS.matRows||[]).filter(r=>String(r.type||"").trim()||String(r.amt||"").trim());
  if(!rows.length){wErr(t("wjNeedPick"));return}
  const packed=[];
  for(const r of rows){
    const type=String(r.type||"").trim(),amt=wNum(r.amt);
    if(!type||!(amt>0)||Number.isNaN(amt)){wErr(t("wjNeedPick"));return}
    const it=wStockItems().find(x=>foldName(x.desc)===foldName(type));
    if(!it){wErr(t("wjNotStock").replace("%n",type));return}
    const fl=wItemFlags(it.desc,it.mat),pcs=r.unit==="pcs"||!fl.len;
    const un=pcs?"piece":(r.unit==="mm"?"mm":"m");
    const needQ=pcs?amt:0,needL=pcs?0:amt,lThou=pcs?0:(un==="mm"?Math.round(amt):Math.round(amt*1000));
    packed.push({type:it.desc,mat:it.mat,qty:needQ,len:needL,unit:un,qThou:Math.round(needQ*1000),lThou:lThou,pcs:pcs});
  }
  const needQ={},needL={};
  for(const m of packed){const k=foldName(m.type);if(m.pcs)needQ[k]=(needQ[k]||0)+m.qty;else needL[k]=(needL[k]||0)+(m.lThou/1000)}
  for(const m of packed){
    const k=foldName(m.type),bal=wOn(m.mat,m.type);
    if((needQ[k]>0&&needQ[k]-bal.qty>1e-9)||(needL[k]>0&&needL[k]-bal.len>1e-9)){wErr(t("wjShort"));return}
  }
  const t0=Date.now(),at=new Date().toISOString();
  for(let i=0;i<packed.length;i++){
    const m=packed[i],id="m"+t0+"-"+i,data={id:id,jobId:WS.jobId,mat:m.mat,desc:m.type,qty:m.qty,len:m.len,unit:m.unit,by:u.name,at:at,example:wEx({desc:m.type})?1:0};
    if(put("m",id,data)===false)return;
    const kid="kout"+id;
    if(put("k",kid,{id:kid,ref:"",dir:"out",mat:m.mat,desc:m.type,qty:m.qty,len:m.len,unit:m.unit,qThou:m.qThou,lThou:m.lThou,at:at,by:u.name,jobId:WS.jobId,example:data.example})===false)return;
  }
  WS.matRows=[];afterSave(true);
}
function wPackStock(u,dir,needPos){

   locks saves (put() refuses), shows a full-screen "Updating… please wait", activates the new worker and reloads.

  setTimeout(()=>{if(updLock&&!(reg&&reg.waiting)&&Date.now()-updT0>=45000)updOff()},45000)}   // download stuck: let staff work, retry next open

    const watch=w=>{if(!w||!navigator.serviceWorker.controller)return;updOn();w.addEventListener("statechange",()=>{if(w.state==="installed"){updReady=true;paintUpd();applyUpdate()}else if(w.state==="redundant"&&!r.waiting)updOff()})};

  ${navigator.share?`<button type="button" id="shS">${esc(t("shareB"))}</button>`:""}<button type="button" class="sec" id="shC">${esc(t("copy"))}</button><button type="button" class="sec" id="shX">${esc(t("close"))}</button></div>`;
  document.body.appendChild(m);
  const x=()=>m.remove();$("shX").onclick=x;m.onclick=e=>{if(e.target===m)x()};
  if($("shS"))$("shS").onclick=()=>navigator.share({title:C.NAME,url:url}).catch(()=>{});
  $("shC").onclick=()=>{try{navigator.clipboard.writeText(url).then(()=>{$("shC").textContent=t("copied")})}catch(e){}};
}

/* VER 10 BACK: a big "← Back" bar at the TOP of every screen except Home (staff-friendly).
   Order: 1) one level up inside the screen (report → report list, app hooks), 2) the screen's own top Back
   button if it has one (kept, made big), 3) the previous screen, 4) Home. A half-filled form asks
   "Leave without saving?" Yes / No first. Bottom tabs are unchanged. Apps extend window.TMC.nav. */
Object.assign(T.en,{navBack:"← Back",navLeave:"Leave without saving?",navYes:"Yes",navNo:"No"});
Object.assign(T.fr,{navBack:"← Retour",navLeave:"Quitter sans enregistrer ?",navYes:"Oui",navNo:"Non"});
if(T.af)Object.assign(T.af,{navBack:"← Terug",navLeave:"Gaan weg sonder om te stoor?",navYes:"Ja",navNo:"Nee"});
if(T.ar)Object.assign(T.ar,{navBack:"← رجوع",navLeave:"خروج بدون حفظ؟",navYes:"نعم",navNo:"لا"});
const NAV={st:[],last:"",up:0,skip:0,pass:0,sticky:0,saved:0,keys:[],sets:[],ups:[],sel:[],dirty:[],clear:[]};
NAV.ups.push(()=>{if(tab==="reports"&&typeof rp!=="undefined"&&rp.id&&REPORTS.length>1){rp.id=null;return true}return false});
function navKey(){let o={t:tab};NAV.keys.forEach(f=>{o=f(o)||o});return JSON.stringify(o)}
function navTyped(){return [...document.querySelectorAll("#view input,#view textarea")].some(el=>{const ty=(el.type||"").toLowerCase();if(el.disabled||el.readOnly||/^(button|submit|reset|hidden|checkbox|radio|range|color)$/.test(ty))return false;if(ty==="file")return !!(el.files&&el.files.length);const v=(el.value||"").trim();if(!v)return false;return /^(date|time|datetime-local|month|week)$/.test(ty)?el.value!==el.defaultValue:true})}
function navDirty(){return NAV.dirty.some(f=>{try{return !!f()}catch(e){return false}})||((!!formDirty||!!NAV.sticky)&&navTyped())}
function navGoBack(){
  if(NAV.ups.some(f=>{try{return f()}catch(e){return false}})){NAV.skip=1;render();scrollTo(0,0);return}
  const cur=NAV.last;for(;;){let k=null;while(NAV.st.length){k=NAV.st.pop();if(k!==NAV.last&&k!==cur)break;k=null}
  const o=k?JSON.parse(k):{t:"home"};tab=o.t;NAV.sets.forEach(f=>f(o));NAV.skip=1;render();if(!k||NAV.last!==cur)break}scrollTo(0,0);
}
function navAsk(yes){
  const m=document.createElement("div");m.className="modal navAsk";m.id="navAsk";
  m.innerHTML=`<div class="card"><h2>${esc(t("navLeave"))}</h2><button type="button" class="red" id="navYes">${esc(t("navYes"))}</button><button type="button" class="sec" id="navNo">${esc(t("navNo"))}</button></div>`;
  document.body.appendChild(m);$("navNo").onclick=()=>m.remove();$("navYes").onclick=()=>{m.remove();yes()};
}
function navClear(){const u=me();if(u)document.querySelectorAll("#view [data-draft]").forEach(el=>L.del(dKey(u,el.dataset.draft)));NAV.clear.forEach(f=>{try{f()}catch(e){}});formDirty=0;NAV.sticky=0}
document.addEventListener("click",e=>{const b=e.target&&e.target.closest&&e.target.closest(".navBack");if(!b)return;if(NAV.pass||!navDirty()){NAV.up=1;return}
  e.preventDefault();e.stopImmediatePropagation();navAsk(()=>{navClear();NAV.pass=1;try{b.click()}finally{NAV.pass=0}})},true);
function navAfter(){
  const V=$("view");if(!V||!me())return;
  const k=navKey();
  if(NAV.skip)NAV.skip=0;else if(NAV.last&&k!==NAV.last){const i=NAV.st.lastIndexOf(k);if(i>=0)NAV.st.length=i;else if(!NAV.up)NAV.st.push(NAV.last)}NAV.up=0;
  NAV.last=k;if(NAV.st.length>30)NAV.st.shift();
  if(tab==="home"){NAV.st=[];return}
  let b=null;const sel=NAV.sel.join(",");
  if(sel){const c=V.querySelector(sel);if(c&&c.parentNode===V){let p=c.previousElementSibling,top=true;while(p){if(p.matches(".box,.tiles,table,form,.vgrid"))top=false;p=p.previousElementSibling}if(top)b=c}}
  if(b){b.classList.add("navBack");b.textContent=t("navBack");V.insertBefore(b,V.firstChild)}
  else{V.insertAdjacentHTML("afterbegin",`<button type="button" class="navBack" id="navBack">${esc(t("navBack"))}</button>`);$("navBack").onclick=navGoBack}
}
/* typing stays "unsaved" across redraws of the SAME screen (e.g. a pick that redraws the form) until a save or a screen change */
{const r0=render;render=function(){const was=formDirty,k0=NAV.last;r0.apply(this,arguments);navAfter();if(NAV.last!==k0||NAV.saved)NAV.sticky=0;else if(was)NAV.sticky=1;NAV.saved=0};window.TMC.render=render}
{const p0=put;put=function(){NAV.sticky=0;NAV.saved=1;return p0.apply(this,arguments)}}
{const m0=remove;remove=function(){NAV.sticky=0;NAV.saved=1;return m0.apply(this,arguments)}}
/* VER 12 SAVE-CLOSE (Johan, 5 Nov 2026): after a SUCCESSFUL Save, close the form and
   return to the previous screen (same as the grey ← Back). Failures stay on the form with
   what was typed. Offline saves that are queued on the phone (put wrote + dirty) count as
   success. Apps: after put(...)!==false call TMC.afterSave(true) instead of render(); on
   validation fail just return (stay). Do not auto-go-back from put itself — only form Saves. */
function afterSave(ok){if(ok===false)return false;navClear();NAV.saved=1;navGoBack();return true}
window.TMC.nav=NAV;window.TMC.navBack=navGoBack;window.TMC.navDirty=navDirty;window.TMC.afterSave=afterSave;
/* VER 10 BACK END + VER 12 SAVE-CLOSE */
render();
if(syncOn())syncNow();else if(sUrl())api({action:"status",name:"-"}).catch(()=>{});else paintSync();  // no Sheet link yet: show "Not connected yet" at once
})();
/* SPELLCHECK START — phone spellcheck on every free-text box (names, items, notes).
   Never on PIN / number / sync / code / masked fields. Covers boxes built later too. */
(function(){
  var SKIP=/pin|url|code|sync|pass|qty|price|amount|num|date|email|phone|tel/i;
  function want(el){
    if(el.hasAttribute("data-nospell")||el.classList.contains("msk")||el.classList.contains("mk")||el.readOnly||(el.getAttribute("autocapitalize")||"")==="characters")return false;
    if(el.tagName==="TEXTAREA")return true;
    var ty=(el.getAttribute("type")||"text").toLowerCase();
    if(ty!=="text"&&ty!=="search")return false;
    var im=(el.getAttribute("inputmode")||"").toLowerCase();
    if(im==="numeric"||im==="decimal"||im==="tel"||im==="email"||im==="url")return false;
    if(SKIP.test((el.id||"")+" "+(el.name||"")+" "+(el.className||"")))return false;
    return true;
  }
  function fix(el){
    if(!want(el)){if(el.tagName==="INPUT"||el.tagName==="TEXTAREA"){el.spellcheck=false;el.setAttribute("spellcheck","false")}return}
    el.spellcheck=true;el.setAttribute("spellcheck","true");el.setAttribute("autocorrect","on");
    var nm=/name|who/i.test((el.id||"")+" "+(el.name||""))&&el.tagName!=="TEXTAREA";
    el.setAttribute("autocapitalize",nm?"words":"sentences");
  }
  function scan(root){if(!root||!root.querySelectorAll)return;if(root.matches&&root.matches("input,textarea"))fix(root);root.querySelectorAll("input,textarea").forEach(fix)}
  window.TMC_spell=scan;
  function go(){scan(document.body);new MutationObserver(function(ms){ms.forEach(function(m){m.addedNodes.forEach(scan)})}).observe(document.body,{childList:true,subtree:true})}
  if(document.body)go();else document.addEventListener("DOMContentLoaded",go);
})();
/* SPELLCHECK END */
</script>
